#####################################################################
#                  Mellow LLL Plus Filament Buffer
#                  Klipper Plugin Configuration
#####################################################################
## Real-time buffer control via extruder_stepper trapq sync and
## hall sensor feedback. Install buffer.py first:
##   cd ~/lll-plus-klipper-plugin/klipper && ./install.sh

[mcu LLL_PLUS]
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_12345-if00
restart_method: command

[temperature_sensor LLL_PLUS]
sensor_type: temperature_mcu
sensor_mcu: LLL_PLUS
min_temp: 0
max_temp: 100

#####################################################################
#                  Buffer Stepper & TMC2208 (TMC2225)
#####################################################################

[extruder_stepper buffer_stepper]
extruder: extruder
step_pin: LLL_PLUS:PC13
dir_pin: LLL_PLUS:PA7
enable_pin: !LLL_PLUS:PA6
microsteps: 8 # Minimize chance of mcu overload when applying drift recovery
gear_ratio: 50:17
rotation_distance: 19.2357

## VACTUAL polarity for the reference Mellow LLL Plus wiring is
## inverted relative to STEP/DIR: positive STEP/DIR pulses drive
## filament FORWARD (toward the extruder), but positive VACTUAL
## drives REVERSE.  The plugin negates VACTUAL internally
## (klipper/buffer.py:_mm_per_s_to_vactual) so this is invisible
## to users — EMPTY recovery drives forward, FULL drives reverse
## as documented.
##
## Troubleshooting only — if you have non-reference wiring and find
## EMPTY recovery drives BACKWARD, the TMC's internal direction
## matches STEP/DIR on your board.  Comment out the negation in
## _mm_per_s_to_vactual (or invert driver_SHAFT) and retest:
##   SET_STEPPER_ENABLE STEPPER=buffer_stepper ENABLE=1
##   SET_TMC_FIELD STEPPER=buffer_stepper FIELD=VACTUAL VALUE=2000
##   # observe direction
##   SET_TMC_FIELD STEPPER=buffer_stepper FIELD=VACTUAL VALUE=0
[tmc2208 extruder_stepper buffer_stepper]
uart_pin: LLL_PLUS:PB1
run_current: 0.3
sense_resistor: 0.150
stealthchop_threshold: 999999

#####################################################################
#                  Buffer Plugin
#####################################################################

[buffer]
stepper: buffer_stepper
## Optional: bind this buffer to a specific extruder.  When set, the
## buffer only syncs while this extruder is the active one, and
## auto-syncs/unsyncs on tool changes.  Omit for a single-buffer
## printer that should follow whatever extruder is currently active.
## NOTE: the parameter is 'bound_extruder' (not 'extruder') — using the
## bare name 'extruder' here causes Mainsail's Extruder dashboard card
## to render this buffer's state instead of the hotend's.
#bound_extruder: extruder
debug: True
## Hall sensors (active when blocked = HIGH, pins inverted)
sensor_empty_pin: ^!LLL_PLUS:PB4
#   HALL3 / pos1: buffer nearly empty
sensor_middle_pin: ^!LLL_PLUS:PB3
#   HALL2 / pos2: ideal middle zone (dead-band target)
sensor_full_pin: ^!LLL_PLUS:PB2
#   HALL1 / pos3: buffer overfull
## Filament presence switch
material_switch_pin: ^!LLL_PLUS:PB7
#   LOW = filament present, HIGH = no filament (inverted)
## Manual buttons (active LOW, inverted)
feed_button_pin: ^!LLL_PLUS:PB12
retract_button_pin: ^!LLL_PLUS:PB13

## Rotation distance feedback gains
drift_gain: 0
#   Multiplier offset applied in EMPTY_MIDDLE / FULL_MIDDLE zones.
#   Larger values correct faster but risk overshoot. (0.0-0.5)
empty_safety_timeout: 30.0
#   Cumulative cap: seconds armed in EMPTY (during a print) before
#   raising an error.  Only fires in the narrow window where the
#   buffer is in EMPTY but recovery has not started — see
#   extreme_recovery_timeout for the recovery per-attempt cap.
full_safety_timeout: 10.0
#   Cumulative cap: seconds in the FULL zone before forced retract.
extreme_recovery_timeout: 10.0
#   Per-attempt cap on the chunked EMPTY recovery feed.  If chunked
#   recovery has not pulled the buffer out of EMPTY within this many
#   seconds, the buffer raises a hard error.  empty_safety_timeout is
#   the cumulative cap for the case where recovery never even starts
#   (e.g. EMPTY zone entered while not printing).

## Manual feed/retract
manual_speed: 40.0
#   Speed (mm/s) for manual feed/retract via buttons or BUFFER_FEED.
#   These moves go through force_move.manual_move's trapezoid profile,
#   so the motor accelerates smoothly to this speed via manual_accel
#   — 40 mm/s is fine.
recovery_speed: 10.0
#   Speed (mm/s) of EMPTY-zone VACTUAL recovery.  Distinct from
#   manual_speed because VACTUAL is an instant velocity step at the
#   TMC chip (no trapezoid ramp), so the safe ceiling is much lower.
#   Empirical limits on the LLL Plus reference hardware (stealthchop,
#   run_current=0.3): stalls above ~30 mm/s, comfortable up to ~20
#   mm/s.  Default 10 mm/s leaves 3x headroom and is still faster
#   than typical extruder draw (5-10 mm/s).  Bump higher if you have
#   spreadcycle, higher run_current, or consistently high-flow prints.
manual_accel: 1500.0
#   Acceleration (mm/s^2) for manual feed/retract moves.
manual_move_distance: 10.0
#   Distance (mm) of each manual move chunk: button-held feed/retract,
#   forced safety retract, BUFFER_FEED/RETRACT continuous mode, and
#   BUFFER_RETRACT_UNTIL_CLEAR.  Smaller chunks = finer control.
## (recovery_move_distance: deprecated.  EMPTY/FULL recovery now uses
##  the TMC VACTUAL register for continuous chip-side velocity mode
##  rather than chunked moves, so the chunk size is meaningless.
##  The parameter still parses for one release with a warning.)

## Error handling
error_clear_hold_time: 2.0
#   Seconds both buttons must be held to clear an error state.
pause_on_runout: True
#   Pause print on filament runout or safety timeout error.

## Initial fill
initial_fill_timeout: 10.0
#   Seconds to feed forward when filament is first inserted.
manual_feed_full_timeout: 3.0
#   Seconds the full sensor must stay triggered during manual feed
#   before auto-stopping. Also used as the stop condition for
#   BUFFER_FEED with no DIST argument.

## Print-start normalization
start_drain_speed: 5.0
#   Reverse VACTUAL drain speed (mm/s) used when a print starts (or
#   BUFFER_ENABLE runs mid-print / on RESUME) with the buffer arm at
#   FULL — the normal state after filament loading, which feeds until
#   the full sensor holds.  Mid-print drift over-fill keeps the slow
#   1 mm/s drain.  extreme_recovery_timeout caps each attempt: 10 s
#   at 5 mm/s = 50 mm of drain; raise the timeout if your buffer arm
#   is longer.  Same VACTUAL instant-step stall-ceiling notes as
#   recovery_speed apply.

## Control timer
control_interval: 0.5
#   Reactor timer interval (seconds) for safety timeout checks.
#   Also used to poll for extruder tool changes.

#####################################################################
#                  Multi-Buffer Setup (optional)
#####################################################################
## For multi-extruder printers with a dedicated buffer per extruder,
## use named [buffer <name>] sections and bind each to its extruder
## via the 'bound_extruder' parameter.  Each buffer is fully independent:
## own sensors, stepper, state machine, and feedback loop.  The buffer
## auto-syncs when its extruder becomes active and unsyncs otherwise.
##
## Example — two buffers for a dual-extruder printer:
#
# [extruder_stepper buffer_stepper_t0]
# extruder: extruder
# step_pin: ...
# ...
#
# [buffer buffer_t0]
# stepper: buffer_stepper_t0
# bound_extruder: extruder
# sensor_empty_pin: ...
# sensor_middle_pin: ...
# sensor_full_pin: ...
# material_switch_pin: ...
#
# [extruder_stepper buffer_stepper_t1]
# extruder: extruder1
# step_pin: ...
# ...
#
# [buffer buffer_t1]
# stepper: buffer_stepper_t1
# bound_extruder: extruder1
# sensor_empty_pin: ...
# sensor_middle_pin: ...
# sensor_full_pin: ...
# material_switch_pin: ...
#
## GCode examples:
##   BUFFER_STATUS BUFFER=buffer_t0    # query a specific buffer
##   BUFFER_ENABLE BUFFER=buffer_t1    # enable a specific buffer
##   BUFFER_STATUS                     # targets [buffer] (bare section)
##                                     # — errors if no bare [buffer]
